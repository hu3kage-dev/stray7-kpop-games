<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stray7 K-Pop Games</title>
    <link rel="stylesheet" href="css/pages-styles.css">
    <link rel="stylesheet" href="css/index-styles.css">
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    
    <script src="assets/i18n/translations.js"></script>
    <script src="data/patchnotes.js"></script>
    <script src="assets/menus/menus.js" defer></script>
    <script src="scripts/pages-script.js" defer></script>
    <script src="scripts/index-script.js" defer></script>
</head>
<body>
    <div class="page-header">
        <h1 data-i18n="index_title"></h1>
        <p data-i18n="index_subtitle"></p>
    </div>
    <div class="game-modes">
        <div class="mode">
            <img data-menu="draft" alt="Draft Mode" class="mode-image">
            <h2 class="mode-title" data-i18n="mode_draft_title"></h2>
            <p class="mode-description" data-i18n="mode_draft_desc"></p>
            <button onclick="irParaDraft()" class="draft-btn" data-i18n="btn_jogar"></button>
        </div>
        <div class="mode">
            <img data-menu="quiz" alt="Quiz Mode" class="mode-image">
            <h2 class="mode-title" data-i18n="mode_quiz_title"></h2>
            <p class="mode-description" data-i18n="mode_quiz_desc"></p>
            <button onclick="modoEmDesenvolvimento()" disabled class="disabled-btn" data-i18n="btn_em_breve"></button>
        </div>
        <div class="mode">
            <img data-menu="gacha" alt="Gacha Mode" class="mode-image">
            <h2 class="mode-title" data-i18n="mode_gacha_title"></h2>
            <p class="mode-description" data-i18n="mode_gacha_desc"></p>
            <button onclick="modoEmDesenvolvimento()" disabled class="disabled-btn" data-i18n="btn_em_breve"></button>
        </div>
        <div class="mode">
            <img data-menu="manager" alt="Manager Mode" class="mode-image">
            <h2 class="mode-title" data-i18n="mode_manager_title"></h2>
            <p class="mode-description" data-i18n="mode_manager_desc"></p>
            <button onclick="modoEmDesenvolvimento()" disabled class="disabled-btn" data-i18n="btn_em_breve"></button>
        </div>
    </div>
</body>
</html>
