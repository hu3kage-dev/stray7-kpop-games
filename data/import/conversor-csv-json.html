<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSV → JSON Converter</title>
<style>
  .content {
    justify-self: center;
    display: flex;
    flex-direction: row;
    gap: 10px;
  }
  .section { 
    max-width: fit-content;
    margin-top: 30px;
    margin-bottom: 30px; 
    padding: 15px; 
    border: 1px solid #444; 
    border-radius: 8px; 
  }
  .fileRow {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .fileRow label {
    min-width: 80px;
    text-align: left;
  }
  textarea {
    width: 100%; 
    height: 150px; 
    margin-top: 10px;
    background: #222; 
    color: #0f0; 
    border: 1px solid #555; 
    display: none;
  }
</style>
<link rel="stylesheet" href="../../css/pages-styles.css">

<script src="../../assets/i18n/translations.js"></script>
<script src="../../data/patchnotes.js"></script>
<script src="../../scripts/pages-script.js" defer></script>
</head>

<body>
  <div class="page-header">
    <h1>Conversor CSV → JS</h1>
    <p>Converta arquivos .csv em arquivos objetos</p>
  </div>

<section class="content">
<div class="section">
  <h2>Idols</h2>
  <input type="file" id="idolsFile">
  <button onclick="processarArquivo('idols')">Converter</button>
  <button onclick="copiarJS('idols')">Copiar JS</button>
  <textarea id="idolsOutput"></textarea>
</div>

<div class="section">
  <h2>Musics</h2>
  <input type="file" id="songsFile">
  <button onclick="processarArquivo('songs')">Converter</button>
  <button onclick="copiarJS('songs')">Copiar JS</button>
  <textarea id="songsOutput"></textarea>
</div>

<div class="section">
  <h2>Producers</h2>
  <input type="file" id="producersFile">
  <button onclick="processarArquivo('producers')">Converter</button>
  <button onclick="copiarJS('producers')">Copiar JS</button>
  <textarea id="producersOutput"></textarea>
</div>
</section>

<section class="content">
<div class="section">
  <h2>Arquivo completo (draft-game-objects.js)</h2>
  <p>Selecione os 3 CSVs para gerar e baixar o arquivo de objetos pronto.</p>
  <div class="fileRow"><label for="fullIdolsFile">Idols</label> <input type="file" id="fullIdolsFile"></div>
  <div class="fileRow"><label for="fullSongsFile">Musics</label> <input type="file" id="fullSongsFile"></div>
  <div class="fileRow"><label for="fullProducersFile">Producers</label> <input type="file" id="fullProducersFile"></div>
  <button onclick="gerarArquivoObjetos()">Gerar draft-game-objects.js</button>
</div>
</section>

<script>
// Tudo aqui dentro roda isolado numa IIFE para não colidir com as declarações
// globais de pages-script.js (que também é carregado nesta página para o header
// funcionar). Só processarArquivo e copiarJS são expostos no window, pois são
// os únicos chamados pelos onclick="" do HTML acima.
(function () {

//f:parseCSVLine
function parseCSVLine(line) {
  const result = [];
  let current = "";
  let insideQuotes = false;

  for (let i = 0; i < line.length; i++) {
    const char = line[i];

    if (char === '"') {
      insideQuotes = !insideQuotes;
      continue;
    }

    if (char === ',' && !insideQuotes) {
      result.push(current.trim());
      current = "";
    } else {
      current += char;
    }
  }

  result.push(current.trim());
  return result;
}

//f:normalizarChave
function normalizarChave(chave) {
  return chave
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/\s+/g, "");
}

//f:parseArray (reconhece apenas " / " como separador)
function parseArray(valor) {
  if (!valor) return [];
  return valor
    .split(/ \/ /)
    .map(v => v.trim())
    .filter(Boolean);
}

// Tabela de aliases de colunas (pt-BR / en-US) aceitos na importação.
// Mantenha esta tabela sincronizada com a mesma constante em draft-setup-script.js.
const CONV_CSV_ALIASES = {
  tipo:                   ["tipo", "type"],
  id:                     ["id"],
  nome:                   ["nome", "name"],
  grupo:                  ["grupo", "group"],
  geracao:                ["geracao", "gen", "generation"],
  aniversario:            ["aniversario", "birthday", "birthdate", "dob"],
  vocal:                  ["vocal", "vocalist", "vocalista"],
  dance:                  ["dance", "dancer", "danca"],
  rap:                    ["rap", "rapper", "raper"],
  center:                 ["center", "centro"],
  visual:                 ["visual"],
  especialidade:          ["especialidade", "specialty", "speciality", "position"],
  conceitosPredominantes: ["conceitos", "concepts", "conceitospredominantes", "mainconcepts", "predominantconcepts"],
  generosPredominantes:   ["generos", "genres", "generospredominantes", "maingenres", "predominantgenres"],
  pontosFortes:           ["pontosfortes", "strengths", "strongpoints", "fortes"],
  pontosFracos:           ["pontosfracos", "weaknesses", "weakpoints", "fracos"],
  fonte:                  ["fonte", "source"],
  conceitosOriginais:     ["conceitos", "concepts", "conceitosoriginais", "originalconcepts"],
  generosOriginais:       ["generos", "genres", "generosoriginais", "originalgenres"],
  musicasConhecidas:      ["musicasconhecidas", "knownsongs", "knownmusics", "knownmusic", "musicas"]
};

//f:convPegarCampo — retorna o primeiro valor não-vazio dentre os aliases pt/en aceitos
function convPegarCampo(obj, aliases) {
  for (const chave of aliases) {
    if (obj[chave] !== undefined && obj[chave] !== "") return obj[chave];
  }
  return "";
}

// Tipo canônico de cada aba — não depende da coluna "Tipo" do CSV,
// já que o próprio botão clicado já identifica a categoria.
const TIPO_CANONICO = {
  idols: "idol",
  songs: "music",
  producers: "producer"
};

//f:converterCSV — converte o texto de um CSV na lista de objetos do tipo ("idols", "songs" ou "producers")
function converterCSV(tipo, texto) {
  const linhas = texto.trim().split("\n");

  const headers = parseCSVLine(linhas[0])
    .map(h => normalizarChave(h));

  let resultado = [];

  for (let i = 1; i < linhas.length; i++) {
    if (!linhas[i].trim()) continue;

    const valores = parseCSVLine(linhas[i]);
    let obj = {};

    headers.forEach((h, index) => {
      obj[h] = valores[index] || "";
    });

    let objFinal = {};

    // IDOLS
    if (tipo === "idols") {
      objFinal = {
        gen: convPegarCampo(obj, CONV_CSV_ALIASES.geracao),
        type: TIPO_CANONICO.idols,
        id: convPegarCampo(obj, CONV_CSV_ALIASES.id),
        name: convPegarCampo(obj, CONV_CSV_ALIASES.nome),
        group: convPegarCampo(obj, CONV_CSV_ALIASES.grupo),
        aniversario: convPegarCampo(obj, CONV_CSV_ALIASES.aniversario),
        vocal: convPegarCampo(obj, CONV_CSV_ALIASES.vocal),
        dance: convPegarCampo(obj, CONV_CSV_ALIASES.dance),
        rap: convPegarCampo(obj, CONV_CSV_ALIASES.rap),
        center: convPegarCampo(obj, CONV_CSV_ALIASES.center),
        visual: convPegarCampo(obj, CONV_CSV_ALIASES.visual),
        especialidade: convPegarCampo(obj, CONV_CSV_ALIASES.especialidade),

        conceitos: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.conceitosPredominantes)),
        generos: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.generosPredominantes)),

        fortes: convPegarCampo(obj, CONV_CSV_ALIASES.pontosFortes),
        fracos: convPegarCampo(obj, CONV_CSV_ALIASES.pontosFracos)
      };
    }

    // SONGS
    if (tipo === "songs") {
      objFinal = {
        type: TIPO_CANONICO.songs,
        id: convPegarCampo(obj, CONV_CSV_ALIASES.id),
        name: convPegarCampo(obj, CONV_CSV_ALIASES.nome),
        fonte: convPegarCampo(obj, CONV_CSV_ALIASES.fonte),

        conceitos: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.conceitosOriginais)),
        generos: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.generosOriginais))
      };
    }

    // PRODUCERS
    if (tipo === "producers") {
      objFinal = {
        type: TIPO_CANONICO.producers,
        id: convPegarCampo(obj, CONV_CSV_ALIASES.id),
        name: convPegarCampo(obj, CONV_CSV_ALIASES.nome),

        conceitos: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.conceitosPredominantes)),
        generos: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.generosPredominantes)),
        musicas: parseArray(convPegarCampo(obj, CONV_CSV_ALIASES.musicasConhecidas))
      };
    }

    resultado.push(objFinal);
  }

  return resultado;
}

//f:processarArquivo
function processarArquivo(tipo) {
  const input = document.getElementById(tipo + "File");
  const output = document.getElementById(tipo + "Output");

  const file = input.files[0];
  if (!file) return alert("Selecione um arquivo!");

  const reader = new FileReader();

  reader.onload = function(e) {
    const resultado = converterCSV(tipo, e.target.result);

    output.value = JSON.stringify(resultado, null, 2);
    output.style.display = "block";
  };

  reader.readAsText(file);
}

//f:lerArquivoTexto — lê um arquivo e devolve uma Promise com o texto
function lerArquivoTexto(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsText(file);
  });
}

//f:gerarArquivoObjetos — lê os 3 CSVs e baixa o draft-game-objects.js completo
// (mesmo formato do arquivo usado pelo jogo: //data:idols, //data:musics e //data:producers antes de cada const)
async function gerarArquivoObjetos() {
  const arquivos = {
    idols:     document.getElementById("fullIdolsFile").files[0],
    songs:     document.getElementById("fullSongsFile").files[0],
    producers: document.getElementById("fullProducersFile").files[0]
  };
  if (!arquivos.idols || !arquivos.songs || !arquivos.producers) {
    return alert("Selecione os 3 arquivos (Idols, Musics e Producers)!");
  }

  try {
    const [idols, songs, producers] = await Promise.all([
      lerArquivoTexto(arquivos.idols),
      lerArquivoTexto(arquivos.songs),
      lerArquivoTexto(arquivos.producers)
    ]);

    const bloco = (marcador, nome, lista) =>
      `//data:${marcador}\n` + `const ${nome} = ${JSON.stringify(lista, null, 2)};`;

    const conteudo = [
      bloco("idols", "idols", converterCSV("idols", idols)),
      bloco("musics", "musics", converterCSV("songs", songs)),
      bloco("producers", "producers", converterCSV("producers", producers))
    ].join("\n\n").replace(/\n/g, "\r\n");   // o arquivo do jogo usa quebras de linha CRLF

    const blob = new Blob([conteudo], { type: "text/javascript;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "draft-game-objects.js";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  } catch (erro) {
    alert("Erro ao ler os arquivos.");
  }
}

//f:copiarJS
function copiarJS(tipo) {
  const output = document.getElementById(tipo + "Output");
  if (!output.value) return alert("Converta primeiro!");

  const nomes = {
    idols: "idols",
    songs: "musics",
    producers: "producers"
  };

  const texto = `const ${nomes[tipo]} = ${output.value};`;

  navigator.clipboard.writeText(texto)
    .then(() => alert("Copiado!"))
    .catch(() => alert("Erro ao copiar"));
}

// Expostas globalmente pois são chamadas pelos onclick="" do HTML.
window.processarArquivo = processarArquivo;
window.copiarJS = copiarJS;
window.gerarArquivoObjetos = gerarArquivoObjetos;

})();
</script>
</body>
</html>
